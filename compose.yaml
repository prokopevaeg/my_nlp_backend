services:
  nlp_app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: /bin/sh -c "while ! nc -z nlp_db 5432; do echo 'Ожидание базы данных...'; sleep 1; done; uvicorn nlp.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    depends_on:
      nlp_db:
        condition: service_started

  nlp_db:
    image: postgres:15
    volumes:
      - nlp_db_data:/var/lib/postgresql
    hostname: database
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  nlp_db_data: