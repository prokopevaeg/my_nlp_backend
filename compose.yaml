services:
  nlp_app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn nlp.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    depends_on:
      nlp_db:
        condition: service_started

  nlp_db:
    image: postgres:18-alpine
    volumes:
      - nlp_db_data:/var/lib/postgresql
    hostname: database
    env_file:
      - .env
    ports:
      - "5432:5432"

volumes:
  nlp_db_data: