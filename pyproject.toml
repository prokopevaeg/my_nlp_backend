[project]
name = "my-nlp-backend"
version = "0.1.0"
description = "My first backend for NLP"
authors = [
    {name = "prokopevaeg",email = "prokopeva@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dishka (>=1.10.1,<2.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "unicorn (>=2.1.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "huawei"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple/"
priority = "primary"
